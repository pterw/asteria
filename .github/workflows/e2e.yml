name: Browser tests

# The interface is mid-migration (see WALKTHROUGH.md, W5). These specs were written against
# the v1 screens and are being carried across one at a time, so the suite runs on a schedule
# and on demand rather than gating every push: a red job on unrelated work teaches people to
# ignore red jobs. When the last spec is green, move this file's job into `ci.yml`.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          ASTERIA_SECRET: playwright-secret-playwright-secret

      - name: Run Playwright
        run: npm run test:e2e
        env:
          ASTERIA_SECRET: playwright-secret-playwright-secret

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/test-results
          retention-days: 7
