[pytest]
# The service is imported as `asteria_insights`, so the project root must be importable
# whether pytest is run from here or from the repository root (`npm run test:python`).
pythonpath = .
testpaths = tests
addopts = -q
# Our own deprecations are errors; a dependency's are not our build to fix. The narrow
# filter comes last because pytest applies the last matching line first.
filterwarnings =
    ignore::DeprecationWarning
    error::DeprecationWarning:asteria_insights.*
